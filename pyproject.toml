[project]
name = "polyfile"
version = "0.1.0"
description = "File manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django==5.2.17",
    "django-cte==3.0.0",
    "django-environ>=0.14.0",
    "django-hint>=0.3.2",
    "django-webpack-loader==3.2.4",
    "marshmallow==4.3.0",
    "python-magic>=0.4.27",
]


[tool.ruff]
exclude = ["migrations"]
lint.ignore = [
    "RUF012",  # mutable-class-default
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
