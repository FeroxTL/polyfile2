[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "polyfile-perf"
version = "0.1.0"
description = "Load and performance testing harness for Polyfile"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "locust>=2.31,<3",
    "plotly>=5.24,<7",
    "psutil>=6,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.17,<1",
]

[project.scripts]
polyfile-perf = "polyfile_perf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["polyfile_perf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
